name: CD
run-name: CD / ${{ github.event.workflow_run.head_branch }} / ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
          VITE_KAKAO_REDIRECT_URI: ${{ secrets.VITE_KAKAO_REDIRECT_URI }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROXY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist to proxy-vm tmp
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ \
            "${{ secrets.PROXY_USER }}@${{ secrets.PROXY_HOST }}:/tmp/admin-dist/"

      - name: Apply dist on proxy-vm
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PROXY_USER }}@${{ secrets.PROXY_HOST }}" << 'EOF'
            set -e
            sudo mkdir -p /var/www/admin
            sudo rsync -av --delete /tmp/admin-dist/ /var/www/admin/
            sudo chown -R www-data:www-data /var/www/admin
          EOF
